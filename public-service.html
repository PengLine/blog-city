<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>公共服务 - 智慧城市管理平台</title>
    <link rel="stylesheet" href="assets/css/common.css">
    <style>
        .container {
            background: #f5f0ff;
            color: #333;
        }

        .nav-btn {
            background: linear-gradient(135deg, #9b59b6 0%, #8e44ad 100%);
            box-shadow: 0 3px 10px rgba(155, 89, 182, 0.3);
        }

        .nav-btn:hover {
            box-shadow: 0 5px 15px rgba(155, 89, 182, 0.4);
        }

        .module-btn.active,

            background: linear-gradient(135deg, #9b59b6 0%, #8e44ad 100%);

        .btn-sm {

        .btn-primary {
            background: #9b59b6;
        }

        .btn-primary:hover {
            background: #8e44ad;
        }

            display: grid;
            grid-template-columns: 2fr 1fr;
            gap: 25px;
            margin-bottom: 25px;
        }

        }

            align-items: center;
            justify-content: center;
            color: white;

        }

            gap: 15px;
            flex-wrap: wrap;
        }
